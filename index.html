<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Cumpleaños Rosiris</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #fff;
            position: relative;
        }

        #fireworks-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .floating-hearts {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 2;
            pointer-events: none;
        }

        .heart {
            position: absolute;
            font-size: 1.5rem;
            color: rgba(255, 255, 255, 0.6);
            animation: floatUp 6s linear infinite;
            bottom: -50px;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg) scale(0.8); opacity: 1; }
            100% { transform: translateY(-110vh) rotate(360deg) scale(1.2); opacity: 0; }
        }

        #welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 8, 25, 0.98);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        #welcome-screen.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .welcome-btn {
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            color: white;
            border: none;
            padding: 20px 45px;
            font-size: 1.6rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(255, 65, 108, 0.6);
            transition: transform 0.3s, box-shadow 0.3s;
            animation: pulseBtn 1.5s infinite;
        }

        .welcome-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 15px 35px rgba(255, 65, 108, 0.9);
        }

        @keyframes pulseBtn {
            0% { transform: scale(1); }
            50% { transform: scale(1.06); }
            100% { transform: scale(1); }
        }

        #main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            max-width: 600px;
            width: 100%;
            text-align: center;
            opacity: 0;
            transform: scale(0.9);
            transition: opacity 1s ease 0.3s, transform 1s ease 0.3s;
            z-index: 3;
        }

        #main-content.visible {
            opacity: 1;
            transform: scale(1);
        }

        .music-player-box {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 300;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 8px 15px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .music-player-box span {
            font-size: 0.9rem;
            font-weight: 600;
            color: #fff;
        }

        audio {
            height: 30px;
            width: 180px;
        }

        h1 {
            font-size: 2.5rem;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
            margin-bottom: 25px;
            background: linear-gradient(45deg, #ffe600, #ff416c, #ff7eb3, #00dbde);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
            animation: gradientShift 4s ease infinite, bounceTitle 2s ease-in-out infinite;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes bounceTitle {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .cake-container {
            position: relative;
            margin: 40px 0 25px 0;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));
        }

        .plate {
            width: 280px;
            height: 18px;
            background: linear-gradient(to right, #dcdde1, #f5f6fa, #dcdde1);
            border-radius: 50%;
            position: absolute;
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .layer {
            position: relative;
            margin: 0 auto;
            border-radius: 12px;
        }

        .layer-bottom {
            width: 220px;
            height: 65px;
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            box-shadow: inset 0 -12px rgba(0,0,0,0.15);
        }

        .layer-top {
            width: 160px;
            height: 55px;
            background: linear-gradient(135deg, #fbc531, #e1b12c);
            margin-bottom: -5px;
            border-radius: 15px 15px 5px 5px;
            box-shadow: inset 0 -10px rgba(0,0,0,0.15);
        }

        .frosting {
            position: absolute;
            top: 0;
            width: 100%;
            height: 18px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .candles {
            position: absolute;
            top: -48px;
            width: 100%;
            display: flex;
            justify-content: space-around;
            padding: 0 10px;
        }

        .candle {
            width: 5px;
            height: 38px;
            background: linear-gradient(to top, #00dbde, #fc00ff);
            position: relative;
            border-radius: 3px;
        }

        .flame {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 7px;
            height: 14px;
            background: #ff9f43;
            border-radius: 50% 50% 20% 20%;
            box-shadow: 0 0 12px #ff9f43, 0 0 22px #ff5252, 0 0 30px #ffeaa7;
            animation: flicker 0.6s infinite alternate;
        }

        @keyframes flicker {
            0% { transform: translateX(-50%) scale(1) rotate(-2deg); opacity: 0.9; }
            100% { transform: translateX(-50%) scale(1.25) rotate(2deg); opacity: 1; filter: brightness(1.4); }
        }

        .letter-section {
            margin-top: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .letter-icon {
            background: #ffffff;
            color: #ff416c;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.2rem;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
            transition: transform 0.3s, background 0.3s, box-shadow 0.3s;
            animation: bounceLetter 2s infinite;
        }

        .letter-icon:hover {
            transform: scale(1.2) rotate(5deg);
            background: #fff0f3;
            box-shadow: 0 12px 30px rgba(255, 65, 108, 0.6);
        }

        @keyframes bounceLetter {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }

        .letter-hint {
            margin-top: 10px;
            font-size: 1rem;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s, visibility 0.4s;
            z-index: 200;
            padding: 20px;
        }

        .modal.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: linear-gradient(135deg, #fff, #fff5f7);
            color: #333;
            padding: 35px 25px;
            border-radius: 25px;
            max-width: 450px;
            width: 100%;
            text-align: center;
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            transform: scale(0.7) rotate(-5deg);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 3px solid #ff7eb3;
        }

        .modal.active .modal-content {
            transform: scale(1) rotate(0deg);
        }

        .modal-content h3 {
            color: #ff416c;
            margin-bottom: 15px;
            font-size: 1.8rem;
            font-weight: 800;
        }

        .modal-content p {
            font-size: 1.15rem;
            line-height: 1.7;
            color: #444;
            margin-bottom: 25px;
        }

        .close-btn {
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 65, 108, 0.4);
            transition: transform 0.2s;
        }

        .close-btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="music-player-box">
        <span>🎵 Música:</span>
        <audio id="bg-music" controls loop>
            <source src="https://raw.githubusercontent.com/4ntoni64/Rosiris/main/op.mp3" type="audio/mpeg">
            Tu navegador no soporta audio.
        </audio>
    </div>

    <canvas id="fireworks-canvas"></canvas>

    <div class="floating-hearts" id="hearts-container"></div>

    <div id="welcome-screen">
        <button class="welcome-btn" onclick="openSurprise()">🎁 Presiona aquí</button>
    </div>

    <div id="main-content">
        <h1>✨ Feliz cumpleaños Rosiris te amo ✨</h1>

        <div class="cake-container">
            <div class="candles" id="candles-wrapper"></div>
            
            <div class="layer layer-top">
                <div class="frosting"></div>
            </div>
            <div class="layer layer-bottom">
                <div class="frosting"></div>
            </div>
            <div class="plate"></div>
        </div>

        <div class="letter-section">
            <div class="letter-icon" onclick="openLetter()" title="Abrir cartita">💌</div>
            <span class="letter-hint">Toca la carta para leer tu mensaje</span>
        </div>
    </div>

    <div class="modal" id="letter-modal">
        <div class="modal-content">
            <h3>Para Rosiris ❤️</h3>
            <p>Es un gran dia para ti no estoy cerca pero con esto puedo transmitirte lo que me importas se que no es de tus dias favoritos te amo eres una mujer fuerte besitos (Te debo el regalo)</p>
            <button class="close-btn" onclick="closeLetter()">Cerrar</button>
        </div>
    </div>

    <script>
        const candlesWrapper = document.getElementById('candles-wrapper');
        for (let i = 0; i < 21; i++) {
            const candle = document.createElement('div');
            candle.className = 'candle';
            const flame = document.createElement('div');
            flame.className = 'flame';
            candle.appendChild(flame);
            candlesWrapper.appendChild(candle);
        }

        const heartsContainer = document.getElementById('hearts-container');
        const heartSymbols = ['❤️', '💖', '✨', '💕', '✨', '💗'];
        
        setInterval(() => {
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.innerHTML = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
            heart.style.fontSize = (Math.random() * 1.5 + 1) + 'rem';
            heartsContainer.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 7000);
        }, 400);

        const canvas = document.getElementById('fireworks-canvas');
        const ctx = canvas.getContext('2d');
        let fireworksActive = false;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 6 + 2;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.alpha = 1;
                this.decay = Math.random() * 0.015 + 0.010;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.08;
                this.alpha -= this.decay;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        let particles = [];

        function createFirework() {
            if (!fireworksActive) return;
            const x = Math.random() * canvas.width;
            const y = Math.random() * (canvas.height * 0.6);
            const colors = ['#ff416c', '#ff7eb3', '#ffe600', '#00dbde', '#fc00ff', '#ffffff'];
            const color = colors[Math.floor(Math.random() * colors.length)];
            
            for (let i = 0; i < 50; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        function animateFireworks() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].alpha <= 0) {
                    particles.splice(i, 1);
                }
            }
            requestAnimationFrame(animateFireworks);
        }
        animateFireworks();

        setInterval(createFirework, 600);

        function openSurprise() {
            document.getElementById('welcome-screen').classList.add('hidden');
            document.getElementById('main-content').classList.add('visible');
            fireworksActive = true; 

            const music = document.getElementById('bg-music');
            music.play().catch(error => {
                console.log("Reproducción requerida desde el reproductor superior.");
            });
        }

        function openLetter() {
            document.getElementById('letter-modal').classList.add('active');
        }

        function closeLetter() {
            document.getElementById('letter-modal').classList.remove('active');
        }
    </script>
</body>
</html>
